name: Crankle aggregate

on:
  schedule:
    - cron: "17 * * * *"   # hourly, incremental
    - cron: "43 4 * * *"   # daily, full recompute (catches withdrawn votes)
  workflow_dispatch:
    inputs:
      full:
        description: "Full recompute"
        type: boolean
        default: false
      dry_run:
        description: "Print instead of writing"
        type: boolean
        default: true

concurrency:
  group: crankle-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crankle-aggregator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crankle-aggregator/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest
      - name: Aggregate
        env:
          CK_KEY_ID: ${{ secrets.CK_KEY_ID }}
          CK_PRIVATE_KEY: ${{ secrets.CK_PRIVATE_KEY }}
          CK_ENV: ${{ vars.CK_ENV || 'production' }}
          AGG_FULL: ${{ (github.event.schedule == '43 4 * * *' || inputs.full == true) && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: python aggregate.py
